# fly.toml app configuration file generated for discordbot-qbw-dq on 2025-11-20T18:05:52Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'discordbot-qbw-dq'
primary_region = 'arn'

[build]

# --- REMOVED [http_service] SECTION ---
# We do not want Fly to manage this as a web service that autoscales based on traffic.
# Instead, we rely on the default process running continuously.

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

# Optional: Health check to ensure the node process is actually up (internal only)
[[checks]]
  port = 3000
  type = "http"
  interval = "10s"
  timeout = "2s"
  method = "GET"
  path = "/"
