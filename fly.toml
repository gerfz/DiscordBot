# fly.toml app configuration file generated for discordbot-qbw-dq on 2025-11-20T18:05:52Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'discordbot-qbw-dq'
primary_region = 'arn'

[build]

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

# Health check to ensure the node process is actually up
[[services]]
  protocol = "tcp"
  internal_port = 3000

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "get"
    path = "/"
    protocol = "http"
