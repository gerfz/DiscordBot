# fly.toml app configuration file generated for discordbot-qbw-dq on 2025-11-20T18:05:52Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'discordbot-qbw-dq'
primary_region = 'arn'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
